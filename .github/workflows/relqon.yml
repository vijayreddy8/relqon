
name: Relqon CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  relqon-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --ignore=tests/python_validation/broken_test.py

      - name: Verify real Terraform configuration
        working-directory: tests/fixtures/terraform_valid
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: Run Relqon validation
        run: python src/relqon/cli.py run . --changed-file tests/fixtures/terraform_valid/main.tf

      - name: Assert Terraform result in JSON report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("reports/validation-report.json")
          if not report_path.is_file():
              raise SystemExit("Relqon JSON validation report was not generated.")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          checks = report.get("checks", [])
          terraform = next(
              (check for check in checks if check.get("name") == "Terraform validation"),
              None,
          )
          if terraform is None:
              raise SystemExit("Terraform validation result is missing from the JSON report.")
          if terraform.get("status") != "PASS":
              raise SystemExit(
                  "Terraform validation did not pass: "
                  + json.dumps(terraform, indent=2)
              )

          step_statuses = {
              step.get("name"): step.get("status")
              for step in terraform.get("steps", [])
          }
          required_steps = {
              "terraform fmt -check -diff",
              "terraform init -backend=false",
              "terraform validate",
          }
          missing = required_steps - step_statuses.keys()
          failed = [name for name in required_steps if step_statuses.get(name) != "PASS"]
          if missing or failed:
              raise SystemExit(
                  f"Terraform report is incomplete. Missing={sorted(missing)}, "
                  f"not passing={sorted(failed)}"
              )

          fixture = "tests/fixtures/terraform_valid/main.tf"
          if fixture not in terraform.get("files_checked", []):
              raise SystemExit("Terraform fixture is not listed in files_checked.")

          print("Terraform JSON report verified: fmt, init, validate all PASS.")
          print(f"Report overall status: {report.get('overall_status')}")
          PY

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relqon-validation-report
          path: reports/validation-report.json
          if-no-files-found: warn

      - name: Publish validation summary
        if: always()
        env:
          REPORT_PATH: reports/validation-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def cell(value):
              return str(value if value is not None else "—").replace("|", "\\|").replace("\n", " ")

          lines = ["## Relqon Validation Report", ""]

          if not report_path.is_file():
              lines.extend([
                  "**Status:** Report unavailable",
                  "",
                  "Relqon did not produce reports/validation-report.json. Check earlier workflow steps for the original failure.",
              ])
              summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print("No Relqon report found; published a diagnostic summary.")
              raise SystemExit(0)

          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              lines.extend(["**Status:** Report could not be parsed", "", f"Details: {cell(exc)}"])
              summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print("Relqon report could not be parsed; published a diagnostic summary.")
              raise SystemExit(0)

          overall = report.get("overall_status", "UNKNOWN")
          counts = report.get("summary", {})
          lines.extend([
              f"**Overall status:** {cell(overall)}",
              "",
              "| Metric | Value |",
              "|---|---:|",
              f"| Passed checks | {cell(counts.get('passed', 0))} |",
              f"| Failed checks | {cell(counts.get('failed', 0))} |",
              f"| Skipped checks | {cell(counts.get('skipped', 0))} |",
              f"| Duration | {cell(report.get('duration_seconds', 0))} seconds |",
              "",
              "### Changed files",
              "",
          ])

          changed_files = report.get("changed_files", [])
          if changed_files:
              lines.extend(f"- {cell(filename)}" for filename in changed_files)
          else:
              lines.append("_No changed files detected._")

          impact = report.get("impact_analysis", {})
          reasons = impact.get("reasons", [])
          if reasons:
              lines.extend(["", "### Impact analysis", ""])
              lines.extend(f"- {cell(reason)}" for reason in reasons)

          lines.extend([
              "",
              "### Validation checks",
              "",
              "| Check | Status | Duration (s) | Details |",
              "|---|---|---:|---|",
          ])

          for check in report.get("checks", []):
              name = cell(check.get("name", "Unnamed check"))
              status = cell(check.get("status", "UNKNOWN"))
              duration = cell(check.get("duration_seconds", 0))
              details = cell(check.get("error") or check.get("details") or "—")
              lines.append(f"| {name} | {status} | {duration} | {details} |")

          guidance = [
              (check.get("name", "Check"), item)
              for check in report.get("checks", [])
              for item in check.get("recovery_guidance", [])
          ]
          if guidance:
              lines.extend(["", "### Recovery guidance", ""])
              for check_name, item in guidance:
                  lines.append(f"- **{cell(check_name)}:** {cell(item)}")

          lines.extend([
              "",
              "### Full report",
              "",
              "Download the relqon-validation-report artifact for the machine-readable JSON report.",
          ])
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Published Relqon summary: {overall}")
          PY
