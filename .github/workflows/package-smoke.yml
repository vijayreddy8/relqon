name: Relqon package smoke test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  package-smoke-test:
    name: Package smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Windows setup script
        if: runner.os == 'Windows'
        run: .\scripts\setup.ps1
      - name: Run Linux and macOS setup script
        if: runner.os != 'Windows'
        run: sh scripts/setup.sh
      - name: Verify installed CLI entry point on Windows
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\relqon.exe --help
          .\.venv\Scripts\relqon.exe run --help
          .\.venv\Scripts\python.exe -m pip show relqon
      - name: Verify installed CLI entry point on Linux and macOS
        if: runner.os != 'Windows'
        run: |
          ./.venv/bin/relqon --help
          ./.venv/bin/relqon run --help
          ./.venv/bin/python -m pip show relqon
